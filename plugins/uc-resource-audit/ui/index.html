<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UC 资源变更查询</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <h1>UC 资源变更查询</h1>
      <button id="refresh-connections" type="button" disabled>刷新连接</button>
    </header>
    <section class="panel query-panel" aria-label="查询条件">
      <div class="filters">
        <label>环境<select id="connection" disabled><option>等待 DBX 连接</option></select></label>
        <label id="database-label" hidden>数据库<select id="database"></select></label>
        <div class="application-filter" id="application-picker">
          <label for="application-search">应用</label>
          <select id="application" hidden aria-hidden="true"></select>
          <div class="picker-input">
            <input id="application-search" type="search" placeholder="先选择环境" autocomplete="off" aria-controls="application-choices" aria-expanded="false" disabled>
            <button id="toggle-applications" type="button" aria-label="打开或关闭应用列表" aria-controls="application-choices" aria-expanded="false" disabled>▾</button>
          </div>
          <section id="application-choices" aria-label="应用列表" hidden>
            <ul id="application-options"></ul>
            <p id="application-empty" class="hint" hidden>没有找到匹配的应用。</p>
          </section>
        </div>
        <label>资源类型<select id="resource-type" disabled><option value="">全部类型</option></select></label>
        <div class="resource-filter" id="resource-picker">
          <label for="resource-search">资源</label>
          <div class="picker-input">
            <input id="resource-search" type="search" placeholder="先选择应用" maxlength="100" autocomplete="off" aria-controls="choices" aria-expanded="false" disabled>
            <button id="toggle-resources" type="button" aria-label="打开或关闭资源树" aria-controls="choices" aria-expanded="false" disabled>▾</button>
          </div>
          <section id="choices" aria-label="资源树" hidden>
            <ul id="resource-options"></ul>
            <p id="tree-empty" class="hint" hidden></p>
            <div class="deleted-actions">
              <button id="search-deleted" type="button" hidden>查已删除</button>
              <span id="deleted-note" class="hint" role="status"></span>
            </div>
            <p id="choices-note" class="hint" hidden>显示前 100 条删除记录，可输入更完整的名称、编码或 ID。</p>
          </section>
        </div>
      </div>
      <p id="notice" role="status" aria-live="polite">正在连接 DBX 工作台…</p>
    </section>
    <section id="resource-table" class="panel" aria-label="资源列表" hidden>
      <div class="records-header"><h2>资源列表</h2></div>
      <div class="table-wrap resources-wrap">
        <table class="resources">
          <thead><tr><th>排序</th><th>描述</th><th>代码</th><th>地址</th><th>类型</th><th>权限</th><th>上级资源</th><th>状态</th></tr></thead>
          <tbody id="resource-rows"></tbody>
        </table>
      </div>
      <p id="resource-table-empty" class="hint" hidden>没有符合条件的资源。</p>
    </section>
    <section id="result" aria-label="资源变更记录" hidden>
      <div class="summary panel">
        <div>
          <h2 id="resource-name"></h2>
          <p id="resource-path" class="resource-path"></p>
          <p id="resource-meta" class="hint"></p>
        </div>
        <span id="resource-status" class="badge"></span>
      </div>
      <div class="panel records">
        <div class="records-header">
          <div>
            <h2>变更时间线</h2>
            <p id="history-count" class="hint"></p>
            <p id="last-modifier" class="hint"></p>
          </div>
          <button id="refresh-history" type="button">重新查询</button>
        </div>
        <p id="history-note" class="hint"></p>
        <div id="history-table" class="table-wrap" hidden>
          <table>
            <thead><tr><th>操作人</th><th>时间</th><th>操作</th><th>字段与内容</th><th>来源</th></tr></thead>
            <tbody id="history"></tbody>
          </table>
        </div>
        <button id="more-history" type="button" hidden>显示更多记录</button>
      </div>
    </section>
  </main>
  <script src="./queries.js"></script>
  <script src="./history.js"></script>
  <script src="./app.js"></script>
</body>
</html>
